plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-android-extensions'
}

android {
    compileSdkVersion rootProject.ext.globalCompileSdkVersion
    buildToolsVersion rootProject.ext.globalBuildToolsVersion


    defaultConfig {
        minSdkVersion rootProject.ext.globalMinSdkVersion
        targetSdkVersion rootProject.ext.globalTargetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
                abiFilters 'armeabi-v7a'
            }
        }
        ndk {
            abiFilters 'armeabi-v7a'
        }

    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["libs"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // For Kotlin projects
    kotlinOptions {
        jvmTarget = "1.8"
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.2.0'
    api 'androidx.test:rules:1.4.0'
    api 'androidx.test:core:1.4.0'
    testApi 'junit:junit:4.13.2'
    testApi 'org.mockito:mockito-core:4.8.0'
    androidTestApi 'androidx.test:runner:1.4.0'
    androidTestApi 'androidx.test.espresso:espresso-core:3.4.0'

    api project(":ai")
    api androidDependencies.view_model
    api androidDependencies.live_data
    api androidDependencies.lifecycles
    api androidDependencies.recyclerView
    api androidDependencies.coroutines_core
    api androidDependencies.coroutines_android

    api globalDependencies.constraintLayout
    api globalDependencies.retrofit
    api globalDependencies.logging_interceptor
    api globalDependencies.converter_gson
    api globalDependencies.okhttp3
    api globalDependencies.okio
//    api globalDependencies.aspectjrt
    api globalDependencies.aspectjtools
    api globalDependencies.rxpermissions
    api globalDependencies.rxjava2
    api globalDependencies.rxjava3
    api globalDependencies.fastjson
    api globalDependencies.retrofit
    api globalDependencies.gson
    api globalDependencies.tinker
    api (globalDependencies.glide) {
        exclude group: 'com.android.support'
    }
    api globalDependencies.glide_transform
    api globalDependencies.gpuimage
}
